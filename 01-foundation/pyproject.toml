[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kop-foundation"
version = "0.1.0"
description = "Knowledge Operating Platform — Foundation primitives, interfaces, and shared models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "redis[hiredis]>=5.0.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "python-jose[cryptography]>=3.3.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "faker>=24.0.0",
]

kafka = [
    "aiokafka>=0.10.0",
]

azure = [
    "azure-storage-blob>=12.19.0",
]

gcs = [
    "google-cloud-storage>=2.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_platform"]

[project.entry-points."kop.auth"]
jwt = "knowledge_platform.auth.jwt:JWTAuthProvider"

[project.entry-points."kop.storage"]
s3 = "knowledge_platform.storage.s3:S3StorageAdapter"
local = "knowledge_platform.storage.local:LocalFileAdapter"

[project.entry-points."kop.events"]
redis_streams = "knowledge_platform.events.bus:RedisStreamsEventBus"
