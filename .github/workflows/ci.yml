name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: MyPy
        run: mypy 01-foundation/src

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "01-foundation/.[dev]"
      - name: Run unit tests
        run: pytest -m "not integration" --tb=short -q

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kop
          POSTGRES_PASSWORD: kop_dev_secret
          POSTGRES_DB: knowledge_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "01-foundation/.[dev]"
      - name: Run integration tests
        env:
          KOP_DB_URL: postgresql://kop:kop_dev_secret@localhost:5432/knowledge_platform
          KOP_REDIS_URL: redis://localhost:6379
        run: pytest -m integration --tb=short -q

  adr-check:
    name: ADR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ADR format
        run: |
          for f in docs/adr/ADR-*.md; do
            if ! grep -q "## Status" "$f"; then
              echo "ADR $f missing ## Status section"
              exit 1
            fi
          done
          echo "All ADRs valid"
