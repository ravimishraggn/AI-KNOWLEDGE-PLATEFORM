[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kop-governance"
version = "0.1.0"
description = "Knowledge Operating Platform — Governance Plane"
requires-python = ">=3.11"
license = { file = "../LICENSE" }

dependencies = [
    "kop-foundation>=0.1.0",
    "opa-python-client>=1.3.0",   # Open Policy Agent client
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/governance"]

[project.entry-points."kop.policy_engines"]
opa = "governance.policy.opa:OPAPolicyEngine"
